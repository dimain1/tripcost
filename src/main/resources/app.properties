# Настройки и тарифы приложения «Расчёт стоимости поездки».
# Файл читается один раз при первом обращении к AppConfig.getInstance().

currency=₽

# Топливо для личного автомобиля
fuel.price=62.50
fuel.consumption.default=8.0

# Тарифы: baseFee — фиксированная часть за одну поездку в одну сторону,
# perKm — цена за километр (для такси — за машину, для остальных — за пассажира)
tariff.TAXI.baseFee=150
tariff.TAXI.perKm=28
tariff.BUS.baseFee=0
tariff.BUS.perKm=3.2
tariff.TRAIN.baseFee=300
tariff.TRAIN.perKm=3.8
tariff.PLANE.baseFee=1500
tariff.PLANE.perKm=5.5

# Дополнительные услуги (паттерн «Декоратор»)
option.baggage.perPassengerLeg=700
option.insurance.percent=3
option.peakSeason.percent=20
option.discount.percent=25

# Геосервис: имитация задержки одного сетевого запроса, мс (паттерн «Заместитель» кэширует ответы)
geo.latencyMs=40

# Согласование командировки (паттерн «Цепочка обязанностей»)
# Политика поездок
policy.taxi.maxKm=150
policy.plane.minKm=500
policy.hotel.maxPerNight=7000
# Лимиты согласования, ₽ (поездки дороже лимита директора рассматривает финансовый комитет)
approval.auto.limit=15000
approval.manager.limit=60000
approval.director.limit=250000

# Выбор транспорта (паттерн «Стратегия»): во сколько оценивается час времени пассажира, ₽
choice.hourValue=500

# Бронирование (паттерн «Сага»): бюджет отдела на командировки, ₽
budget.department=150000

# Хранение данных (паттерн «Репозиторий»): папка для сохранённых шаблонов поездок.
# Пусто - папка .tripcost в домашнем каталоге пользователя.
storage.dir=

# Фоновые расчёты (паттерн «Future / Promise»): число потоков в пуле
pool.threads=6
